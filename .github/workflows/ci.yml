name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  geovox:
    name: GeoVox Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        working-directory: Minecraft Innovations/GeoVox
        run: pip install -e ".[all]" pytest
      - name: Run tests
        run: pytest tests/geovox/ -v

  roblox:
    name: Roblox Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Run Roblox tests
        run: pytest tests/roblox/ -v

  originals:
    name: Original Projects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Run original project tests
        run: pytest tests/invalid_request/ -v

  omniversal:
    name: Omniversal Calculator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Run omniversal tests
        run: pytest tests/omniversal/ -v

  automuse:
    name: AutoMuse Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: Audio Innovations/AutoMuse
        run: pip install -e . pytest
      - name: Run tests
        working-directory: Audio Innovations/AutoMuse
        run: python -m pytest ../../tests/automuse/ -v

  mcstudio:
    name: Minecraft Studio Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: Minecraft Innovations/Minecraft Studio
        run: pip install -e . pytest
      - name: Run tests
        working-directory: Minecraft Innovations/Minecraft Studio
        run: python -m pytest ../../tests/mcstudio/ -v
