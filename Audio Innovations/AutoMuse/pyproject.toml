[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automuse"
version = "0.1.0"
description = "Conversational music theory engine and MIDI composer"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
automuse = "automuse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
