<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Schedule Planner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #fff;
            font-weight: 400;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .toolbar button {
            padding: 10px 20px;
            background: #2d4a3e;
            border: none;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9em;
            transition: background 0.2s;
        }

        .toolbar button:hover {
            background: #3d5a4e;
        }

        .toolbar button.danger {
            background: #4a2d2d;
        }

        .toolbar button.danger:hover {
            background: #5a3d3d;
        }

        .save-status {
            margin-left: auto;
            display: flex;
            align-items: center;
            color: #888;
            font-size: 0.85em;
        }

        .save-status.saved {
            color: #4a9;
        }

        .table-container {
            overflow-x: auto;
            border: 1px solid #333;
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        thead {
            background: #2a4a5a;
        }

        th {
            padding: 12px 15px;
            text-align: left;
            font-weight: 500;
            color: #fff;
            border-bottom: 2px solid #444;
            white-space: nowrap;
        }

        th.col-abbrev { width: 15%; }
        th.col-name { width: 25%; }
        th.col-assignment { width: 25%; }
        th.col-date { width: 12%; }
        th.col-time { width: 12%; }
        th.col-actions { width: 80px; text-align: center; }

        tbody tr {
            background: #252525;
            border-bottom: 1px solid #333;
        }

        tbody tr:nth-child(even) {
            background: #2a2a2a;
        }

        tbody tr:hover {
            background: #303030;
        }

        tbody tr.selected {
            background: #2d3a4a;
        }

        td {
            padding: 8px 10px;
            border-right: 1px solid #333;
        }

        td:last-child {
            border-right: none;
        }

        td input {
            width: 100%;
            padding: 8px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 3px;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 0.95em;
        }

        td input:focus {
            background: #1a1a1a;
            border-color: #4a6a8a;
            outline: none;
        }

        td input::placeholder {
            color: #555;
        }

        .actions-cell {
            text-align: center;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: #666;
            cursor: pointer;
            padding: 5px 10px;
            font-size: 1.2em;
            border-radius: 3px;
            transition: all 0.2s;
        }

        .delete-btn:hover {
            background: #4a2d2d;
            color: #e55;
        }

        .row-handle {
            cursor: grab;
            color: #555;
            padding: 5px;
        }

        .row-handle:hover {
            color: #888;
        }

        .credit {
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #333;
            color: #666;
            font-style: italic;
            font-size: 0.85em;
        }

        .empty-message {
            text-align: center;
            padding: 40px;
            color: #555;
        }

        /* Row number column */
        .row-num {
            color: #555;
            text-align: center;
            width: 40px;
            font-size: 0.85em;
            user-select: none;
        }

        /* Modal for export/import */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #252525;
            padding: 25px;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
        }

        .modal-content h2 {
            margin-bottom: 15px;
            color: #fff;
        }

        .modal-content textarea {
            width: 100%;
            height: 200px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 4px;
            color: #e0e0e0;
            padding: 10px;
            font-family: monospace;
            font-size: 0.85em;
            resize: vertical;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: flex-end;
        }

        .modal-buttons button {
            padding: 8px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
        }

        .modal-buttons .cancel {
            background: #444;
            color: #fff;
        }

        .modal-buttons .confirm {
            background: #2d4a3e;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Academic Schedule Planner</h1>

        <div class="toolbar">
            <button onclick="addRow()">+ Add Assignment</button>
            <button onclick="addMultipleRows()">+ Add 5 Rows</button>
            <button onclick="saveData()">💾 Save</button>
            <button onclick="exportData()">📤 Export</button>
            <button onclick="showImportModal()">📥 Import</button>
            <button class="danger" onclick="clearAll()">🗑️ Clear All</button>
            <div class="save-status" id="save-status"></div>
        </div>

        <div class="table-container">
            <table id="schedule-table">
                <thead>
                    <tr>
                        <th class="row-num">#</th>
                        <th class="col-abbrev">Class Abbreviation</th>
                        <th class="col-name">Class Name</th>
                        <th class="col-assignment">Assignment</th>
                        <th class="col-date">Due Date</th>
                        <th class="col-time">Due Time</th>
                        <th class="col-actions"></th>
                    </tr>
                </thead>
                <tbody id="table-body">
                </tbody>
            </table>
        </div>

        <p class="credit">
            Template created by Taylor U freshman Charles Harrell Johnson, III
        </p>
    </div>

    <!-- Import Modal -->
    <div class="modal" id="import-modal">
        <div class="modal-content">
            <h2>Import Data</h2>
            <textarea id="import-data" placeholder="Paste exported JSON data here..."></textarea>
            <div class="modal-buttons">
                <button class="cancel" onclick="closeImportModal()">Cancel</button>
                <button class="confirm" onclick="importData()">Import</button>
            </div>
        </div>
    </div>

    <script>
        // Data storage
        let assignments = [];

        // Generate unique ID
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        // Create empty assignment
        function createAssignment() {
            return {
                id: generateId(),
                abbreviation: '',
                className: '',
                assignment: '',
                dueDate: '',
                dueTime: ''
            };
        }

        // Render table
        function renderTable() {
            const tbody = document.getElementById('table-body');

            if (assignments.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="empty-message">
                            No assignments yet. Click "+ Add Assignment" to get started.
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = assignments.map((item, index) => `
                <tr data-id="${item.id}">
                    <td class="row-num">${index + 1}</td>
                    <td>
                        <input type="text"
                               value="${escapeHtml(item.abbreviation)}"
                               placeholder="EDU 150"
                               onchange="updateField('${item.id}', 'abbreviation', this.value)"
                               onkeydown="handleKeyDown(event, ${index}, 0)">
                    </td>
                    <td>
                        <input type="text"
                               value="${escapeHtml(item.className)}"
                               placeholder="Education in America"
                               onchange="updateField('${item.id}', 'className', this.value)"
                               onkeydown="handleKeyDown(event, ${index}, 1)">
                    </td>
                    <td>
                        <input type="text"
                               value="${escapeHtml(item.assignment)}"
                               placeholder="Lesson Plan #4"
                               onchange="updateField('${item.id}', 'assignment', this.value)"
                               onkeydown="handleKeyDown(event, ${index}, 2)">
                    </td>
                    <td>
                        <input type="text"
                               value="${escapeHtml(item.dueDate)}"
                               placeholder="2/2/2025"
                               onchange="updateField('${item.id}', 'dueDate', this.value)"
                               onkeydown="handleKeyDown(event, ${index}, 3)">
                    </td>
                    <td>
                        <input type="text"
                               value="${escapeHtml(item.dueTime)}"
                               placeholder="3:00 PM"
                               onchange="updateField('${item.id}', 'dueTime', this.value)"
                               onkeydown="handleKeyDown(event, ${index}, 4)">
                    </td>
                    <td class="actions-cell">
                        <button class="delete-btn" onclick="deleteRow('${item.id}')" title="Delete row">×</button>
                    </td>
                </tr>
            `).join('');
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        // Add single row
        function addRow() {
            assignments.push(createAssignment());
            renderTable();
            autoSave();

            // Focus the new row's first input
            setTimeout(() => {
                const inputs = document.querySelectorAll('#table-body input');
                if (inputs.length > 0) {
                    inputs[inputs.length - 5].focus();
                }
            }, 10);
        }

        // Add multiple rows
        function addMultipleRows() {
            for (let i = 0; i < 5; i++) {
                assignments.push(createAssignment());
            }
            renderTable();
            autoSave();
        }

        // Delete row
        function deleteRow(id) {
            assignments = assignments.filter(a => a.id !== id);
            renderTable();
            autoSave();
        }

        // Update field
        function updateField(id, field, value) {
            const item = assignments.find(a => a.id === id);
            if (item) {
                item[field] = value;
                autoSave();
            }
        }

        // Handle keyboard navigation
        function handleKeyDown(event, rowIndex, colIndex) {
            const totalCols = 5;

            if (event.key === 'Enter') {
                event.preventDefault();
                // Move to next row, same column (or create new row)
                if (rowIndex === assignments.length - 1) {
                    addRow();
                }
                setTimeout(() => {
                    const inputs = document.querySelectorAll('#table-body input');
                    const targetIndex = (rowIndex + 1) * totalCols + colIndex;
                    if (inputs[targetIndex]) {
                        inputs[targetIndex].focus();
                    }
                }, 10);
            } else if (event.key === 'Tab' && !event.shiftKey && colIndex === totalCols - 1) {
                // Tab from last column - go to next row first column
                if (rowIndex === assignments.length - 1) {
                    event.preventDefault();
                    addRow();
                }
            } else if (event.key === 'ArrowDown') {
                event.preventDefault();
                const inputs = document.querySelectorAll('#table-body input');
                const targetIndex = (rowIndex + 1) * totalCols + colIndex;
                if (inputs[targetIndex]) {
                    inputs[targetIndex].focus();
                }
            } else if (event.key === 'ArrowUp') {
                event.preventDefault();
                const inputs = document.querySelectorAll('#table-body input');
                const targetIndex = (rowIndex - 1) * totalCols + colIndex;
                if (inputs[targetIndex]) {
                    inputs[targetIndex].focus();
                }
            }
        }

        // Save to localStorage
        function saveData() {
            localStorage.setItem('academicSchedule', JSON.stringify(assignments));
            showSaveStatus('Saved!');
        }

        // Auto-save with debounce
        let saveTimeout;
        function autoSave() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                saveData();
            }, 1000);
        }

        // Show save status
        function showSaveStatus(message) {
            const status = document.getElementById('save-status');
            status.textContent = message;
            status.classList.add('saved');
            setTimeout(() => {
                status.textContent = '';
                status.classList.remove('saved');
            }, 2000);
        }

        // Load from localStorage
        function loadData() {
            const saved = localStorage.getItem('academicSchedule');
            if (saved) {
                try {
                    assignments = JSON.parse(saved);
                } catch (e) {
                    assignments = [];
                }
            }

            // Add example rows if empty
            if (assignments.length === 0) {
                assignments = [
                    {
                        id: generateId(),
                        abbreviation: 'EDU 150',
                        className: 'Education in America',
                        assignment: 'Lesson Plan #4',
                        dueDate: '2/2/2025',
                        dueTime: '3:00 PM'
                    },
                    {
                        id: generateId(),
                        abbreviation: 'SCI 201',
                        className: 'Introduction to Biology',
                        assignment: 'Lab Report #2',
                        dueDate: '2/5/2025',
                        dueTime: '11:59 PM'
                    },
                    {
                        id: generateId(),
                        abbreviation: 'ENG 101',
                        className: 'College Writing',
                        assignment: 'Essay Draft',
                        dueDate: '2/7/2025',
                        dueTime: '9:00 AM'
                    },
                    {
                        id: generateId(),
                        abbreviation: 'EDU 150',
                        className: 'Education in America',
                        assignment: 'Reading Response #5',
                        dueDate: '2/9/2025',
                        dueTime: '3:00 PM'
                    }
                ];
            }

            renderTable();
        }

        // Export data
        function exportData() {
            const dataStr = JSON.stringify(assignments, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'academic-schedule.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        // Show import modal
        function showImportModal() {
            document.getElementById('import-modal').classList.add('active');
            document.getElementById('import-data').value = '';
            document.getElementById('import-data').focus();
        }

        // Close import modal
        function closeImportModal() {
            document.getElementById('import-modal').classList.remove('active');
        }

        // Import data
        function importData() {
            const data = document.getElementById('import-data').value;
            try {
                const parsed = JSON.parse(data);
                if (Array.isArray(parsed)) {
                    assignments = parsed;
                    renderTable();
                    saveData();
                    closeImportModal();
                    showSaveStatus('Imported!');
                } else {
                    alert('Invalid data format. Expected an array.');
                }
            } catch (e) {
                alert('Invalid JSON data. Please check the format.');
            }
        }

        // Clear all
        function clearAll() {
            if (confirm('Are you sure you want to delete all assignments?')) {
                assignments = [];
                renderTable();
                saveData();
            }
        }

        // Close modal on outside click
        document.getElementById('import-modal').addEventListener('click', (e) => {
            if (e.target.id === 'import-modal') {
                closeImportModal();
            }
        });

        // Initialize
        loadData();
    </script>
</body>
</html>
