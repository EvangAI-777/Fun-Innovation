<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative Music</title>
    <meta name="description" content="Algorithmic music synthesizer producing endless, never-repeating compositions in your browser.">
    <meta name="theme-color" content="#0a0a12">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a12;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #visualizer {
            flex: 1;
            min-height: 300px;
            background: linear-gradient(180deg, #0a0a12 0%, #12121f 100%);
            position: relative;
            overflow: hidden;
        }

        #visualizer canvas {
            width: 100%;
            height: 100%;
        }

        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 18, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            cursor: pointer;
            transition: opacity 0.5s;
        }

        #start-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #start-overlay h1 {
            font-size: 2em;
            color: #8be9fd;
            margin-bottom: 10px;
        }

        #start-overlay p {
            color: #666;
            font-size: 0.9em;
        }

        #controls {
            background: #12121f;
            padding: 20px;
            border-top: 1px solid #2a2a3a;
        }

        .control-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 15px;
            align-items: flex-start;
        }

        .control-section {
            background: #1a1a2e;
            padding: 15px;
            border-radius: 8px;
            min-width: 200px;
            flex: 1;
        }

        .section-title {
            font-size: 0.75em;
            color: #8be9fd;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .control-group {
            margin-bottom: 10px;
        }

        .control-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.7em;
            color: #888;
            margin-bottom: 4px;
        }

        input[type="range"] {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            background: #2a2a3a;
            border-radius: 2px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: #8be9fd;
            border-radius: 50%;
            cursor: pointer;
        }

        .layer-toggles {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .layer-toggle {
            padding: 6px 12px;
            background: #2a2a3a;
            border: 1px solid #3a3a4a;
            border-radius: 4px;
            color: #888;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.75em;
            transition: all 0.2s;
        }

        .layer-toggle.active {
            background: #8be9fd;
            color: #0a0a12;
            border-color: #8be9fd;
        }

        .layer-toggle:hover {
            border-color: #8be9fd;
        }

        .mood-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .mood-btn {
            padding: 8px 16px;
            background: #2a2a3a;
            border: 1px solid #3a3a4a;
            border-radius: 4px;
            color: #ccc;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.75em;
            transition: all 0.2s;
        }

        .mood-btn:hover {
            border-color: #8be9fd;
            color: #8be9fd;
        }

        .mood-btn.active {
            background: #8be9fd;
            color: #0a0a12;
            border-color: #8be9fd;
        }

        select {
            width: 100%;
            padding: 8px;
            background: #2a2a3a;
            border: 1px solid #3a3a4a;
            border-radius: 4px;
            color: #ccc;
            font-family: inherit;
            font-size: 0.8em;
            cursor: pointer;
        }

        select:focus {
            outline: none;
            border-color: #8be9fd;
        }

        .main-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .play-btn {
            padding: 12px 30px;
            background: #8be9fd;
            border: none;
            border-radius: 4px;
            color: #0a0a12;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9em;
            font-weight: bold;
            transition: all 0.2s;
        }

        .play-btn:hover {
            background: #a0f0ff;
        }

        .play-btn.playing {
            background: #ff79c6;
        }

        #now-playing {
            display: flex;
            gap: 20px;
            font-size: 0.75em;
            color: #666;
            margin-left: 20px;
        }

        .note-display {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .note-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #333;
            transition: background 0.1s;
        }

        .note-dot.active {
            background: #8be9fd;
            box-shadow: 0 0 10px #8be9fd;
        }

        .note-dot.bass { background: #ff79c6; box-shadow: 0 0 10px #ff79c6; }
        .note-dot.melody { background: #8be9fd; box-shadow: 0 0 10px #8be9fd; }
        .note-dot.pad { background: #50fa7b; box-shadow: 0 0 10px #50fa7b; }
        .note-dot.arp { background: #bd93f9; box-shadow: 0 0 10px #bd93f9; }
        .note-dot.perc { background: #ffb86c; box-shadow: 0 0 10px #ffb86c; }
        .skip-link { position:absolute;top:-100%;left:16px;background:#8be9fd;color:#0a0a12;padding:8px 16px;border-radius:0 0 6px 6px;font-size:0.85em;font-weight:600;text-decoration:none;z-index:10000; }
        .skip-link:focus { top:0; }
        .home-btn { position:fixed;top:14px;left:14px;z-index:9999;display:inline-flex;align-items:center;gap:6px;padding:10px 18px;min-height:44px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:20px;color:#aaa;text-decoration:none;font-family:'Segoe UI',system-ui,sans-serif;font-size:0.85em;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background 0.2s,color 0.2s; }
        .home-btn:hover,.home-btn:focus-visible { background:rgba(255,255,255,0.14);color:#fff; }
        .home-btn:focus-visible { outline:2px solid #fff;outline-offset:2px; }
        button:focus-visible, select:focus-visible, input[type="range"]:focus-visible { outline:2px solid #8be9fd;outline-offset:2px; }
        @media (max-width:600px) { .control-row { gap:10px; } .control-group { min-width:100%; } .home-btn { position:static;display:flex;width:fit-content;margin:10px auto 0; } }
        @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation-duration:0.01ms!important;transition-duration:0.01ms!important; } }
    </style>
</head>
<body>
    <a class="skip-link" href="#controls">Skip to controls</a>
    <a class="home-btn" href="../../index.html">&larr; Home</a>
    <main id="visualizer">
        <canvas id="viz-canvas" aria-label="Music visualization canvas"></canvas>
        <div id="start-overlay" role="button" tabindex="0" aria-label="Click to begin playing generative music">
            <h1>▶ Generative Music</h1>
            <p>Click anywhere to begin</p>
        </div>
    </main>

    <section id="controls" aria-label="Music controls">
        <div class="control-row">
            <div class="main-controls">
                <button class="play-btn" id="play-btn">▶ Play</button>
                <div id="now-playing">
                    <div class="note-display">
                        <span>Bass</span>
                        <div class="note-dot" id="dot-bass"></div>
                    </div>
                    <div class="note-display">
                        <span>Melody</span>
                        <div class="note-dot" id="dot-melody"></div>
                    </div>
                    <div class="note-display">
                        <span>Pad</span>
                        <div class="note-dot" id="dot-pad"></div>
                    </div>
                    <div class="note-display">
                        <span>Arp</span>
                        <div class="note-dot" id="dot-arp"></div>
                    </div>
                    <div class="note-display">
                        <span>Perc</span>
                        <div class="note-dot" id="dot-perc"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="control-row">
            <div class="control-section">
                <div class="section-title">Mood</div>
                <div class="mood-buttons">
                    <button class="mood-btn active" data-mood="calm">Calm</button>
                    <button class="mood-btn" data-mood="dreamy">Dreamy</button>
                    <button class="mood-btn" data-mood="tense">Tense</button>
                    <button class="mood-btn" data-mood="uplifting">Uplifting</button>
                    <button class="mood-btn" data-mood="dark">Dark</button>
                    <button class="mood-btn" data-mood="chaos">Chaos</button>
                </div>
            </div>

            <div class="control-section">
                <div class="section-title">Scale</div>
                <select id="scale-select">
                    <option value="pentatonic">Pentatonic</option>
                    <option value="major">Major</option>
                    <option value="minor">Natural Minor</option>
                    <option value="dorian">Dorian</option>
                    <option value="phrygian">Phrygian</option>
                    <option value="lydian">Lydian</option>
                    <option value="mixolydian">Mixolydian</option>
                    <option value="blues">Blues</option>
                    <option value="japanese">Japanese</option>
                    <option value="arabic">Arabic</option>
                </select>
            </div>

            <div class="control-section">
                <div class="section-title">Layers</div>
                <div class="layer-toggles">
                    <button class="layer-toggle active" data-layer="bass">Bass</button>
                    <button class="layer-toggle active" data-layer="melody">Melody</button>
                    <button class="layer-toggle active" data-layer="pad">Pad</button>
                    <button class="layer-toggle active" data-layer="arp">Arpeggio</button>
                    <button class="layer-toggle active" data-layer="perc">Percussion</button>
                </div>
            </div>
        </div>

        <div class="control-row">
            <div class="control-section">
                <div class="section-title">Tempo & Rhythm</div>
                <div class="control-group">
                    <div class="control-label">
                        <span>BPM</span>
                        <span id="bpm-val">72</span>
                    </div>
                    <input type="range" id="bpm" min="40" max="160" value="72" aria-label="Tempo BPM">
                </div>
                <div class="control-group">
                    <div class="control-label">
                        <span>Swing</span>
                        <span id="swing-val">0%</span>
                    </div>
                    <input type="range" id="swing" min="0" max="50" value="0" aria-label="Swing">
                </div>
            </div>

            <div class="control-section">
                <div class="section-title">Character</div>
                <div class="control-group">
                    <div class="control-label">
                        <span>Density</span>
                        <span id="density-val">50%</span>
                    </div>
                    <input type="range" id="density" min="10" max="100" value="50" aria-label="Density">
                </div>
                <div class="control-group">
                    <div class="control-label">
                        <span>Randomness</span>
                        <span id="random-val">30%</span>
                    </div>
                    <input type="range" id="randomness" min="0" max="100" value="30" aria-label="Randomness">
                </div>
            </div>

            <div class="control-section">
                <div class="section-title">Sound</div>
                <div class="control-group">
                    <div class="control-label">
                        <span>Reverb</span>
                        <span id="reverb-val">40%</span>
                    </div>
                    <input type="range" id="reverb" min="0" max="100" value="40" aria-label="Reverb">
                </div>
                <div class="control-group">
                    <div class="control-label">
                        <span>Master Volume</span>
                        <span id="volume-val">70%</span>
                    </div>
                    <input type="range" id="volume" min="0" max="100" value="70" aria-label="Volume">
                </div>
            </div>
        </div>
    </div>

    <script>
        // === SCALES (intervals from root) ===
        const SCALES = {
            pentatonic: [0, 2, 4, 7, 9],
            major: [0, 2, 4, 5, 7, 9, 11],
            minor: [0, 2, 3, 5, 7, 8, 10],
            dorian: [0, 2, 3, 5, 7, 9, 10],
            phrygian: [0, 1, 3, 5, 7, 8, 10],
            lydian: [0, 2, 4, 6, 7, 9, 11],
            mixolydian: [0, 2, 4, 5, 7, 9, 10],
            blues: [0, 3, 5, 6, 7, 10],
            japanese: [0, 1, 5, 7, 8],
            arabic: [0, 1, 4, 5, 7, 8, 11]
        };

        // === MOOD PRESETS ===
        const MOODS = {
            calm: {
                bpm: 65,
                density: 35,
                randomness: 20,
                reverb: 60,
                swing: 10,
                scale: 'pentatonic',
                rootNote: 48 // C3
            },
            dreamy: {
                bpm: 55,
                density: 45,
                randomness: 40,
                reverb: 80,
                swing: 15,
                scale: 'lydian',
                rootNote: 53 // F3
            },
            tense: {
                bpm: 85,
                density: 55,
                randomness: 35,
                reverb: 30,
                swing: 0,
                scale: 'phrygian',
                rootNote: 52 // E3
            },
            uplifting: {
                bpm: 100,
                density: 65,
                randomness: 25,
                reverb: 45,
                swing: 20,
                scale: 'major',
                rootNote: 48 // C3
            },
            dark: {
                bpm: 60,
                density: 40,
                randomness: 30,
                reverb: 70,
                swing: 5,
                scale: 'minor',
                rootNote: 45 // A2
            },
            chaos: {
                bpm: 130,
                density: 85,
                randomness: 80,
                reverb: 25,
                swing: 30,
                scale: 'blues',
                rootNote: 48
            }
        };

        // === CONFIGURATION ===
        let CONFIG = {
            bpm: 72,
            density: 50,
            randomness: 30,
            reverb: 40,
            swing: 0,
            volume: 0.7,
            scale: 'pentatonic',
            rootNote: 48,
            layers: {
                bass: true,
                melody: true,
                pad: true,
                arp: true,
                perc: true
            }
        };

        // === AUDIO CONTEXT ===
        let audioCtx = null;
        let masterGain = null;
        let reverbNode = null;
        let reverbGain = null;
        let dryGain = null;
        let analyser = null;
        let isPlaying = false;
        let schedulerInterval = null;
        let nextNoteTime = 0;
        let currentStep = 0;

        // Visualization data
        let vizData = new Uint8Array(128);
        let activeNotes = { bass: false, melody: false, pad: false, arp: false, perc: false };

        // === UTILITY FUNCTIONS ===
        function midiToFreq(midi) {
            return 440 * Math.pow(2, (midi - 69) / 12);
        }

        function getScaleNote(degree, octaveOffset = 0) {
            const scale = SCALES[CONFIG.scale];
            const octave = Math.floor(degree / scale.length);
            const noteInScale = scale[((degree % scale.length) + scale.length) % scale.length];
            return CONFIG.rootNote + noteInScale + (octave + octaveOffset) * 12;
        }

        function chance(probability) {
            return Math.random() * 100 < probability;
        }

        function pick(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        function clamp(val, min, max) {
            return Math.max(min, Math.min(max, val));
        }

        // === CREATE REVERB IMPULSE ===
        function createReverbImpulse(duration = 2, decay = 2) {
            const length = audioCtx.sampleRate * duration;
            const impulse = audioCtx.createBuffer(2, length, audioCtx.sampleRate);

            for (let channel = 0; channel < 2; channel++) {
                const data = impulse.getChannelData(channel);
                for (let i = 0; i < length; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
                }
            }
            return impulse;
        }

        // === INITIALIZE AUDIO ===
        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            // Master gain
            masterGain = audioCtx.createGain();
            masterGain.gain.value = CONFIG.volume;
            masterGain.connect(audioCtx.destination);

            // Analyser for visualization
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;
            masterGain.connect(analyser);

            // Reverb setup
            reverbNode = audioCtx.createConvolver();
            reverbNode.buffer = createReverbImpulse(2.5, 2.5);

            reverbGain = audioCtx.createGain();
            reverbGain.gain.value = CONFIG.reverb / 100;

            dryGain = audioCtx.createGain();
            dryGain.gain.value = 1 - (CONFIG.reverb / 200);

            reverbNode.connect(reverbGain);
            reverbGain.connect(masterGain);
            dryGain.connect(masterGain);
        }

        // === SYNTHESIZERS ===
        function playBass(time, note, duration) {
            if (!CONFIG.layers.bass) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(midiToFreq(note), time);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(400, time);
            filter.Q.value = 2;

            gain.gain.setValueAtTime(0, time);
            gain.gain.linearRampToValueAtTime(0.3, time + 0.02);
            gain.gain.setValueAtTime(0.3, time + duration - 0.05);
            gain.gain.linearRampToValueAtTime(0, time + duration);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(dryGain);
            gain.connect(reverbNode);

            osc.start(time);
            osc.stop(time + duration);

            flashDot('bass', time);
        }

        function playMelody(time, note, duration) {
            if (!CONFIG.layers.melody) return;

            const osc = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc.type = 'sine';
            osc2.type = 'triangle';
            osc.frequency.setValueAtTime(midiToFreq(note), time);
            osc2.frequency.setValueAtTime(midiToFreq(note) * 1.002, time); // Slight detune

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(2000, time);
            filter.frequency.linearRampToValueAtTime(800, time + duration);

            gain.gain.setValueAtTime(0, time);
            gain.gain.linearRampToValueAtTime(0.15, time + 0.03);
            gain.gain.setValueAtTime(0.12, time + duration * 0.7);
            gain.gain.linearRampToValueAtTime(0, time + duration);

            osc.connect(filter);
            osc2.connect(filter);
            filter.connect(gain);
            gain.connect(dryGain);
            gain.connect(reverbNode);

            osc.start(time);
            osc2.start(time);
            osc.stop(time + duration);
            osc2.stop(time + duration);

            flashDot('melody', time);
        }

        function playPad(time, notes, duration) {
            if (!CONFIG.layers.pad) return;

            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            filter.type = 'lowpass';
            filter.frequency.value = 1200;
            filter.Q.value = 0.5;

            gain.gain.setValueAtTime(0, time);
            gain.gain.linearRampToValueAtTime(0.08, time + 0.5);
            gain.gain.setValueAtTime(0.08, time + duration - 0.8);
            gain.gain.linearRampToValueAtTime(0, time + duration);

            notes.forEach((note, i) => {
                const osc = audioCtx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(midiToFreq(note), time);
                osc.frequency.setValueAtTime(midiToFreq(note) * (1 + (Math.random() - 0.5) * 0.01), time);
                osc.connect(filter);
                osc.start(time);
                osc.stop(time + duration);
            });

            filter.connect(gain);
            gain.connect(dryGain);
            gain.connect(reverbNode);

            flashDot('pad', time);
        }

        function playArp(time, note, duration) {
            if (!CONFIG.layers.arp) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc.type = 'square';
            osc.frequency.setValueAtTime(midiToFreq(note), time);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(3000, time);
            filter.frequency.linearRampToValueAtTime(500, time + duration);

            gain.gain.setValueAtTime(0, time);
            gain.gain.linearRampToValueAtTime(0.08, time + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.001, time + duration);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(dryGain);
            gain.connect(reverbNode);

            osc.start(time);
            osc.stop(time + duration);

            flashDot('arp', time);
        }

        function playPerc(time, type) {
            if (!CONFIG.layers.perc) return;

            const gain = audioCtx.createGain();

            if (type === 'kick') {
                const osc = audioCtx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, time);
                osc.frequency.exponentialRampToValueAtTime(30, time + 0.15);
                gain.gain.setValueAtTime(0.4, time);
                gain.gain.exponentialRampToValueAtTime(0.001, time + 0.3);
                osc.connect(gain);
                osc.start(time);
                osc.stop(time + 0.3);
            } else if (type === 'hat') {
                const bufferSize = audioCtx.sampleRate * 0.05;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.value = 8000;

                gain.gain.setValueAtTime(0.1, time);
                gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);

                noise.connect(filter);
                filter.connect(gain);
                noise.start(time);
            } else if (type === 'snare') {
                // Noise component
                const bufferSize = audioCtx.sampleRate * 0.15;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(0.15, time);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, time + 0.15);

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 3000;

                noise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(gain);
                noise.start(time);

                // Tone component
                const osc = audioCtx.createOscillator();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, time);
                const oscGain = audioCtx.createGain();
                oscGain.gain.setValueAtTime(0.2, time);
                oscGain.gain.exponentialRampToValueAtTime(0.001, time + 0.08);
                osc.connect(oscGain);
                oscGain.connect(gain);
                osc.start(time);
                osc.stop(time + 0.1);
            }

            gain.connect(dryGain);
            flashDot('perc', time);
        }

        // === FLASH NOTE INDICATORS ===
        function flashDot(layer, time) {
            const delay = Math.max(0, (time - audioCtx.currentTime) * 1000);
            setTimeout(() => {
                const dot = document.getElementById(`dot-${layer}`);
                dot.classList.add('active', layer);
                setTimeout(() => {
                    dot.classList.remove('active', layer);
                }, 150);
            }, delay);
        }

        // === GENERATIVE SEQUENCER ===
        let bassPattern = [];
        let melodyState = { lastNote: 2, direction: 1 };
        let padChord = [0, 2, 4]; // Simple triad
        let arpPattern = [];
        let arpIndex = 0;

        function generateBassPattern() {
            const patterns = [
                [0, null, null, null, 0, null, null, null],
                [0, null, 0, null, 0, null, 0, null],
                [0, null, null, 0, null, null, 0, null],
                [0, null, null, null, null, null, 0, null]
            ];
            bassPattern = pick(patterns).map(n => n !== null ? n + (Math.random() < 0.3 ? pick([-5, 4, 7]) : 0) : null);
        }

        function generateArpPattern() {
            const length = pick([4, 6, 8]);
            arpPattern = [];
            for (let i = 0; i < length; i++) {
                arpPattern.push(Math.floor(Math.random() * 5));
            }
        }

        function getNextMelodyNote() {
            const scale = SCALES[CONFIG.scale];
            const movement = Math.random() < 0.6 ? pick([-1, 1]) : pick([-2, 2, 0]);

            // Occasionally make bigger jumps
            if (chance(CONFIG.randomness * 0.3)) {
                melodyState.lastNote += pick([-3, -4, 3, 4, 5]);
            } else {
                melodyState.lastNote += movement;
            }

            // Keep in reasonable range
            melodyState.lastNote = clamp(melodyState.lastNote, 0, scale.length * 2);

            return melodyState.lastNote;
        }

        function scheduleNotes() {
            const secondsPerBeat = 60.0 / CONFIG.bpm;
            const secondsPerStep = secondsPerBeat / 2; // 8th notes

            while (nextNoteTime < audioCtx.currentTime + 0.1) {
                const step = currentStep % 16;
                const beat = Math.floor(step / 2);

                // Apply swing to off-beats
                let swingOffset = 0;
                if (step % 2 === 1) {
                    swingOffset = (CONFIG.swing / 100) * secondsPerStep;
                }

                const time = nextNoteTime + swingOffset;

                // Bass: every 4 beats, with pattern
                if (step % 2 === 0 && bassPattern[beat] !== null) {
                    if (chance(CONFIG.density)) {
                        playBass(time, getScaleNote(bassPattern[beat], -1), secondsPerBeat * 1.5);
                    }
                }

                // Melody: probabilistic based on density
                if (chance(CONFIG.density * 0.7) && step % 2 === 0) {
                    const note = getNextMelodyNote();
                    playMelody(time, getScaleNote(note, 1), secondsPerBeat * pick([0.5, 1, 1.5, 2]));
                }

                // Pad: sustained chords, change occasionally
                if (step === 0) {
                    if (chance(30)) {
                        // Change chord
                        const root = pick([0, 3, 4, 5, -2]);
                        padChord = [root, root + 2, root + 4];
                    }
                    const padNotes = padChord.map(n => getScaleNote(n, 0));
                    playPad(time, padNotes, secondsPerBeat * 8);
                }

                // Arpeggio
                if (chance(CONFIG.density * 0.8)) {
                    const arpNote = arpPattern[arpIndex % arpPattern.length];
                    playArp(time, getScaleNote(arpNote + padChord[0], 1), secondsPerStep * 0.8);
                    arpIndex++;
                }

                // Percussion
                if (CONFIG.layers.perc) {
                    // Kick on 1 and 3
                    if (step === 0 || step === 8) {
                        if (chance(CONFIG.density + 30)) playPerc(time, 'kick');
                    }
                    // Snare on 2 and 4
                    if (step === 4 || step === 12) {
                        if (chance(CONFIG.density)) playPerc(time, 'snare');
                    }
                    // Hi-hats
                    if (chance(CONFIG.density * 0.6)) {
                        playPerc(time, 'hat');
                    }
                }

                // Regenerate patterns occasionally
                if (step === 0 && chance(20 + CONFIG.randomness * 0.3)) {
                    generateBassPattern();
                }
                if (step === 0 && chance(15 + CONFIG.randomness * 0.2)) {
                    generateArpPattern();
                }

                currentStep++;
                nextNoteTime += secondsPerStep;
            }
        }

        // === VISUALIZATION ===
        const vizCanvas = document.getElementById('viz-canvas');
        const vizCtx = vizCanvas.getContext('2d');

        function resizeViz() {
            const container = document.getElementById('visualizer');
            vizCanvas.width = container.clientWidth;
            vizCanvas.height = container.clientHeight;
        }
        resizeViz();
        window.addEventListener('resize', resizeViz);

        function drawVisualization() {
            if (analyser && isPlaying) {
                analyser.getByteFrequencyData(vizData);
            }

            vizCtx.fillStyle = 'rgba(10, 10, 18, 0.1)';
            vizCtx.fillRect(0, 0, vizCanvas.width, vizCanvas.height);

            const centerX = vizCanvas.width / 2;
            const centerY = vizCanvas.height / 2;
            const maxRadius = Math.min(centerX, centerY) * 0.8;

            // Draw frequency circles
            const bars = 64;
            for (let i = 0; i < bars; i++) {
                const angle = (i / bars) * Math.PI * 2 - Math.PI / 2;
                const value = vizData[i] || 0;
                const radius = maxRadius * 0.3 + (value / 255) * maxRadius * 0.7;

                const x = centerX + Math.cos(angle) * radius;
                const y = centerY + Math.sin(angle) * radius;

                const hue = (i / bars) * 60 + 180; // Cyan to purple range
                vizCtx.beginPath();
                vizCtx.arc(x, y, 2 + (value / 255) * 4, 0, Math.PI * 2);
                vizCtx.fillStyle = `hsla(${hue}, 80%, 60%, ${0.3 + (value / 255) * 0.7})`;
                vizCtx.fill();

                // Lines to center
                vizCtx.beginPath();
                vizCtx.moveTo(centerX + Math.cos(angle) * maxRadius * 0.3, centerY + Math.sin(angle) * maxRadius * 0.3);
                vizCtx.lineTo(x, y);
                vizCtx.strokeStyle = `hsla(${hue}, 80%, 60%, ${0.1 + (value / 255) * 0.3})`;
                vizCtx.lineWidth = 1;
                vizCtx.stroke();
            }

            requestAnimationFrame(drawVisualization);
        }

        // === CONTROLS ===
        function startMusic() {
            if (!audioCtx) initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            generateBassPattern();
            generateArpPattern();

            nextNoteTime = audioCtx.currentTime;
            currentStep = 0;
            isPlaying = true;

            schedulerInterval = setInterval(scheduleNotes, 25);

            document.getElementById('play-btn').textContent = '⏸ Pause';
            document.getElementById('play-btn').classList.add('playing');
        }

        function stopMusic() {
            isPlaying = false;
            clearInterval(schedulerInterval);

            document.getElementById('play-btn').textContent = '▶ Play';
            document.getElementById('play-btn').classList.remove('playing');
        }

        function toggleMusic() {
            if (isPlaying) {
                stopMusic();
            } else {
                startMusic();
            }
        }

        function applyMood(moodName) {
            const mood = MOODS[moodName];
            if (!mood) return;

            CONFIG.bpm = mood.bpm;
            CONFIG.density = mood.density;
            CONFIG.randomness = mood.randomness;
            CONFIG.reverb = mood.reverb;
            CONFIG.swing = mood.swing;
            CONFIG.scale = mood.scale;
            CONFIG.rootNote = mood.rootNote;

            // Update UI
            document.getElementById('bpm').value = mood.bpm;
            document.getElementById('bpm-val').textContent = mood.bpm;
            document.getElementById('density').value = mood.density;
            document.getElementById('density-val').textContent = mood.density + '%';
            document.getElementById('randomness').value = mood.randomness;
            document.getElementById('random-val').textContent = mood.randomness + '%';
            document.getElementById('reverb').value = mood.reverb;
            document.getElementById('reverb-val').textContent = mood.reverb + '%';
            document.getElementById('swing').value = mood.swing;
            document.getElementById('swing-val').textContent = mood.swing + '%';
            document.getElementById('scale-select').value = mood.scale;

            // Update reverb
            if (reverbGain) {
                reverbGain.gain.value = mood.reverb / 100;
                dryGain.gain.value = 1 - (mood.reverb / 200);
            }

            // Regenerate patterns
            generateBassPattern();
            generateArpPattern();
            melodyState.lastNote = 2;
        }

        // Event listeners
        document.getElementById('start-overlay').addEventListener('click', () => {
            document.getElementById('start-overlay').classList.add('hidden');
            startMusic();
        });

        document.getElementById('play-btn').addEventListener('click', toggleMusic);

        document.querySelectorAll('.mood-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                applyMood(btn.dataset.mood);
            });
        });

        document.querySelectorAll('.layer-toggle').forEach(btn => {
            btn.addEventListener('click', () => {
                btn.classList.toggle('active');
                CONFIG.layers[btn.dataset.layer] = btn.classList.contains('active');
            });
        });

        document.getElementById('scale-select').addEventListener('change', (e) => {
            CONFIG.scale = e.target.value;
            generateBassPattern();
            generateArpPattern();
        });

        // Sliders
        document.getElementById('bpm').addEventListener('input', (e) => {
            CONFIG.bpm = parseInt(e.target.value);
            document.getElementById('bpm-val').textContent = e.target.value;
        });

        document.getElementById('swing').addEventListener('input', (e) => {
            CONFIG.swing = parseInt(e.target.value);
            document.getElementById('swing-val').textContent = e.target.value + '%';
        });

        document.getElementById('density').addEventListener('input', (e) => {
            CONFIG.density = parseInt(e.target.value);
            document.getElementById('density-val').textContent = e.target.value + '%';
        });

        document.getElementById('randomness').addEventListener('input', (e) => {
            CONFIG.randomness = parseInt(e.target.value);
            document.getElementById('random-val').textContent = e.target.value + '%';
        });

        document.getElementById('reverb').addEventListener('input', (e) => {
            CONFIG.reverb = parseInt(e.target.value);
            document.getElementById('reverb-val').textContent = e.target.value + '%';
            if (reverbGain) {
                reverbGain.gain.value = CONFIG.reverb / 100;
                dryGain.gain.value = 1 - (CONFIG.reverb / 200);
            }
        });

        document.getElementById('volume').addEventListener('input', (e) => {
            CONFIG.volume = parseInt(e.target.value) / 100;
            document.getElementById('volume-val').textContent = e.target.value + '%';
            if (masterGain) {
                masterGain.gain.value = CONFIG.volume;
            }
        });

        // Start visualization loop
        drawVisualization();
    </script>
</body>
</html>
