<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergent Ecosystem</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            display: flex;
            min-height: 100vh;
        }
        #canvas-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        canvas {
            border: 1px solid #333;
            background: #0d1117;
            border-radius: 4px;
        }
        #controls {
            width: 320px;
            background: #161b22;
            padding: 20px;
            overflow-y: auto;
            border-left: 1px solid #333;
        }
        h1 {
            font-size: 1.4em;
            margin-bottom: 8px;
            color: #58a6ff;
        }
        .subtitle {
            font-size: 0.8em;
            color: #666;
            margin-bottom: 20px;
        }
        .section {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #2a2a2a;
        }
        .section-title {
            font-size: 0.9em;
            color: #8b949e;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 0.85em;
        }
        .stat-label { color: #8b949e; }
        .stat-value { font-weight: bold; }
        .plants { color: #3fb950; }
        .herbivores { color: #58a6ff; }
        .predators { color: #f85149; }

        .control-group {
            margin-bottom: 12px;
        }
        .control-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8em;
            margin-bottom: 4px;
            color: #8b949e;
        }
        input[type="range"] {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: #2a2a2a;
            border-radius: 3px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #58a6ff;
            border-radius: 50%;
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            background: #21262d;
            color: #e0e0e0;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85em;
            transition: background 0.2s;
        }
        button:hover {
            background: #30363d;
        }
        button.primary {
            background: #238636;
            border-color: #238636;
        }
        button.primary:hover {
            background: #2ea043;
        }
        button.danger {
            background: #da3633;
            border-color: #da3633;
        }
        button.danger:hover {
            background: #f85149;
        }
        .legend {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            font-size: 0.8em;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        #message-log {
            margin-top: 15px;
            padding: 10px;
            background: #0d1117;
            border-radius: 4px;
            font-size: 0.75em;
            max-height: 120px;
            overflow-y: auto;
            color: #8b949e;
        }
        .log-entry {
            margin-bottom: 4px;
            padding-bottom: 4px;
            border-bottom: 1px solid #1a1a1a;
        }
        .log-entry:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="world"></canvas>
    </div>
    <div id="controls">
        <h1>Emergent Ecosystem</h1>
        <p class="subtitle">Simple rules → Complex behavior</p>

        <div class="section">
            <div class="section-title">Population</div>
            <div class="stat-row">
                <span class="stat-label">Plants</span>
                <span class="stat-value plants" id="plant-count">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Herbivores</span>
                <span class="stat-value herbivores" id="herb-count">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Predators</span>
                <span class="stat-value predators" id="pred-count">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Generation</span>
                <span class="stat-value" id="generation">0</span>
            </div>
        </div>

        <div class="section">
            <div class="section-title">World Parameters</div>

            <div class="control-group">
                <div class="control-label">
                    <span>Plant Growth Rate</span>
                    <span id="plant-rate-val">0.02</span>
                </div>
                <input type="range" id="plant-rate" min="0.001" max="0.1" step="0.001" value="0.02">
            </div>

            <div class="control-group">
                <div class="control-label">
                    <span>Herbivore Speed</span>
                    <span id="herb-speed-val">2</span>
                </div>
                <input type="range" id="herb-speed" min="0.5" max="5" step="0.1" value="2">
            </div>

            <div class="control-group">
                <div class="control-label">
                    <span>Predator Speed</span>
                    <span id="pred-speed-val">2.5</span>
                </div>
                <input type="range" id="pred-speed" min="0.5" max="6" step="0.1" value="2.5">
            </div>

            <div class="control-group">
                <div class="control-label">
                    <span>Reproduction Threshold</span>
                    <span id="repro-thresh-val">80</span>
                </div>
                <input type="range" id="repro-thresh" min="50" max="150" step="5" value="80">
            </div>

            <div class="control-group">
                <div class="control-label">
                    <span>Vision Range</span>
                    <span id="vision-val">80</span>
                </div>
                <input type="range" id="vision" min="30" max="200" step="5" value="80">
            </div>
        </div>

        <div class="section">
            <div class="section-title">Actions</div>
            <button class="primary" id="pause-btn">Pause</button>
            <button id="add-plants">+ Add Plants</button>
            <button id="add-herbs">+ Add Herbivores</button>
            <button id="add-preds">+ Add Predators</button>
            <button class="danger" id="reset-btn">Reset World</button>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-dot" style="background: #3fb950;"></div>
                <span>Plant</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot" style="background: #58a6ff;"></div>
                <span>Herbivore</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot" style="background: #f85149;"></div>
                <span>Predator</span>
            </div>
        </div>

        <div id="message-log">
            <div class="log-entry">World initialized...</div>
        </div>
    </div>

    <script>
        // === CONFIGURATION ===
        const CONFIG = {
            plantGrowthRate: 0.02,
            herbivoreSpeed: 2,
            predatorSpeed: 2.5,
            reproductionThreshold: 80,
            visionRange: 80,
            energyDecay: {
                herbivore: 0.15,
                predator: 0.2
            },
            energyGain: {
                eating: 40,
                plant: 25
            },
            reproductionCost: 40,
            maxEntities: {
                plants: 300,
                herbivores: 100,
                predators: 50
            }
        };

        // === CANVAS SETUP ===
        const canvas = document.getElementById('world');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const container = document.getElementById('canvas-container');
            const size = Math.min(container.clientWidth - 40, container.clientHeight - 40, 800);
            canvas.width = size;
            canvas.height = size;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // === ENTITY CLASSES ===
        class Entity {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.energy = 50 + Math.random() * 30;
                this.age = 0;
                this.id = Math.random().toString(36).substr(2, 9);
            }

            wrap() {
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }

            distanceTo(other) {
                const dx = other.x - this.x;
                const dy = other.y - this.y;
                return Math.sqrt(dx * dx + dy * dy);
            }

            angleTo(other) {
                return Math.atan2(other.y - this.y, other.x - this.x);
            }
        }

        class Plant extends Entity {
            constructor(x, y) {
                super(x, y);
                this.energy = 20 + Math.random() * 20;
                this.size = 3 + Math.random() * 3;
                this.maxSize = 6 + Math.random() * 4;
                this.growthRate = 0.01 + Math.random() * 0.02;
            }

            update() {
                this.age++;
                if (this.size < this.maxSize) {
                    this.size += this.growthRate;
                    this.energy += 0.1;
                }
            }

            draw() {
                const pulse = Math.sin(this.age * 0.05) * 0.5 + 0.5;
                const alpha = 0.6 + pulse * 0.4;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(63, 185, 80, ${alpha})`;
                ctx.fill();

                // Inner glow
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 0.5, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(100, 220, 100, ${alpha * 0.7})`;
                ctx.fill();
            }

            canReproduce() {
                return this.size >= this.maxSize * 0.9 && Math.random() < CONFIG.plantGrowthRate;
            }
        }

        class Herbivore extends Entity {
            constructor(x, y) {
                super(x, y);
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.size = 6;
                this.wanderAngle = Math.random() * Math.PI * 2;
            }

            update(plants, predators) {
                this.age++;
                this.energy -= CONFIG.energyDecay.herbivore;

                // Find nearest plant
                let nearestPlant = null;
                let nearestPlantDist = Infinity;
                for (const plant of plants) {
                    const dist = this.distanceTo(plant);
                    if (dist < nearestPlantDist) {
                        nearestPlantDist = dist;
                        nearestPlant = plant;
                    }
                }

                // Find nearest predator
                let nearestPredator = null;
                let nearestPredDist = Infinity;
                for (const pred of predators) {
                    const dist = this.distanceTo(pred);
                    if (dist < nearestPredDist) {
                        nearestPredDist = dist;
                        nearestPredator = pred;
                    }
                }

                // Behavior: flee predators > seek food > wander
                let targetAngle = this.wanderAngle;
                let speed = CONFIG.herbivoreSpeed * 0.5;

                if (nearestPredator && nearestPredDist < CONFIG.visionRange) {
                    // Flee!
                    targetAngle = this.angleTo(nearestPredator) + Math.PI;
                    speed = CONFIG.herbivoreSpeed * 1.3;
                } else if (nearestPlant && nearestPlantDist < CONFIG.visionRange && this.energy < 70) {
                    // Seek food
                    targetAngle = this.angleTo(nearestPlant);
                    speed = CONFIG.herbivoreSpeed;
                } else {
                    // Wander
                    this.wanderAngle += (Math.random() - 0.5) * 0.3;
                    targetAngle = this.wanderAngle;
                    speed = CONFIG.herbivoreSpeed * 0.4;
                }

                this.vx = Math.cos(targetAngle) * speed;
                this.vy = Math.sin(targetAngle) * speed;

                this.x += this.vx;
                this.y += this.vy;
                this.wrap();

                return nearestPlant && nearestPlantDist < 10 ? nearestPlant : null;
            }

            draw() {
                const energyRatio = Math.min(this.energy / 100, 1);
                const size = this.size * (0.7 + energyRatio * 0.3);

                // Body
                ctx.beginPath();
                ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(88, 166, 255, ${0.5 + energyRatio * 0.5})`;
                ctx.fill();

                // Direction indicator
                const angle = Math.atan2(this.vy, this.vx);
                ctx.beginPath();
                ctx.moveTo(this.x + Math.cos(angle) * size * 1.5, this.y + Math.sin(angle) * size * 1.5);
                ctx.lineTo(this.x + Math.cos(angle - 2.5) * size * 0.7, this.y + Math.sin(angle - 2.5) * size * 0.7);
                ctx.lineTo(this.x + Math.cos(angle + 2.5) * size * 0.7, this.y + Math.sin(angle + 2.5) * size * 0.7);
                ctx.closePath();
                ctx.fillStyle = `rgba(88, 166, 255, ${0.3 + energyRatio * 0.4})`;
                ctx.fill();
            }

            canReproduce() {
                return this.energy > CONFIG.reproductionThreshold && Math.random() < 0.02;
            }
        }

        class Predator extends Entity {
            constructor(x, y) {
                super(x, y);
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.size = 8;
                this.wanderAngle = Math.random() * Math.PI * 2;
                this.huntCooldown = 0;
            }

            update(herbivores) {
                this.age++;
                this.energy -= CONFIG.energyDecay.predator;
                if (this.huntCooldown > 0) this.huntCooldown--;

                // Find nearest herbivore
                let nearestPrey = null;
                let nearestDist = Infinity;
                for (const herb of herbivores) {
                    const dist = this.distanceTo(herb);
                    if (dist < nearestDist) {
                        nearestDist = dist;
                        nearestPrey = herb;
                    }
                }

                let targetAngle = this.wanderAngle;
                let speed = CONFIG.predatorSpeed * 0.3;

                if (nearestPrey && nearestDist < CONFIG.visionRange * 1.2) {
                    // Hunt!
                    targetAngle = this.angleTo(nearestPrey);
                    speed = CONFIG.predatorSpeed * (this.energy < 30 ? 1.3 : 1);
                } else {
                    // Wander
                    this.wanderAngle += (Math.random() - 0.5) * 0.2;
                    targetAngle = this.wanderAngle;
                }

                this.vx = Math.cos(targetAngle) * speed;
                this.vy = Math.sin(targetAngle) * speed;

                this.x += this.vx;
                this.y += this.vy;
                this.wrap();

                return nearestPrey && nearestDist < 12 && this.huntCooldown === 0 ? nearestPrey : null;
            }

            draw() {
                const energyRatio = Math.min(this.energy / 100, 1);
                const size = this.size * (0.7 + energyRatio * 0.3);

                // Body
                ctx.beginPath();
                ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(248, 81, 73, ${0.5 + energyRatio * 0.5})`;
                ctx.fill();

                // Menacing inner glow
                ctx.beginPath();
                ctx.arc(this.x, this.y, size * 0.5, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 120, 100, ${energyRatio * 0.6})`;
                ctx.fill();

                // Direction spikes
                const angle = Math.atan2(this.vy, this.vx);
                for (let i = -1; i <= 1; i++) {
                    const spikeAngle = angle + i * 0.4;
                    ctx.beginPath();
                    ctx.moveTo(this.x + Math.cos(spikeAngle) * size, this.y + Math.sin(spikeAngle) * size);
                    ctx.lineTo(this.x + Math.cos(spikeAngle) * size * 1.8, this.y + Math.sin(spikeAngle) * size * 1.8);
                    ctx.strokeStyle = `rgba(248, 81, 73, ${0.4 + energyRatio * 0.4})`;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }

            canReproduce() {
                return this.energy > CONFIG.reproductionThreshold * 1.2 && Math.random() < 0.015;
            }
        }

        // === WORLD STATE ===
        let plants = [];
        let herbivores = [];
        let predators = [];
        let generation = 0;
        let paused = false;
        let lastLogTime = 0;

        function log(message) {
            const logEl = document.getElementById('message-log');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = `[${generation}] ${message}`;
            logEl.insertBefore(entry, logEl.firstChild);
            if (logEl.children.length > 20) {
                logEl.removeChild(logEl.lastChild);
            }
        }

        function initWorld() {
            plants = [];
            herbivores = [];
            predators = [];
            generation = 0;

            // Spawn initial plants
            for (let i = 0; i < 80; i++) {
                plants.push(new Plant(
                    Math.random() * canvas.width,
                    Math.random() * canvas.height
                ));
            }

            // Spawn initial herbivores
            for (let i = 0; i < 25; i++) {
                herbivores.push(new Herbivore(
                    Math.random() * canvas.width,
                    Math.random() * canvas.height
                ));
            }

            // Spawn initial predators
            for (let i = 0; i < 8; i++) {
                predators.push(new Predator(
                    Math.random() * canvas.width,
                    Math.random() * canvas.height
                ));
            }

            log('World initialized');
        }

        function updateStats() {
            document.getElementById('plant-count').textContent = plants.length;
            document.getElementById('herb-count').textContent = herbivores.length;
            document.getElementById('pred-count').textContent = predators.length;
            document.getElementById('generation').textContent = generation;
        }

        // === MAIN LOOP ===
        function update() {
            if (paused) return;

            generation++;

            // Update plants
            const newPlants = [];
            for (const plant of plants) {
                plant.update();
                if (plant.canReproduce() && plants.length + newPlants.length < CONFIG.maxEntities.plants) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 20 + Math.random() * 30;
                    newPlants.push(new Plant(
                        plant.x + Math.cos(angle) * dist,
                        plant.y + Math.sin(angle) * dist
                    ));
                }
            }
            plants.push(...newPlants);

            // Update herbivores
            const deadPlants = new Set();
            const newHerbivores = [];
            herbivores = herbivores.filter(herb => {
                const eatenPlant = herb.update(plants, predators);
                if (eatenPlant) {
                    herb.energy += CONFIG.energyGain.plant;
                    deadPlants.add(eatenPlant.id);
                }
                if (herb.canReproduce() && herbivores.length + newHerbivores.length < CONFIG.maxEntities.herbivores) {
                    herb.energy -= CONFIG.reproductionCost;
                    newHerbivores.push(new Herbivore(herb.x + (Math.random() - 0.5) * 20, herb.y + (Math.random() - 0.5) * 20));
                }
                return herb.energy > 0;
            });
            herbivores.push(...newHerbivores);
            plants = plants.filter(p => !deadPlants.has(p.id));

            // Update predators
            const deadHerbivores = new Set();
            const newPredators = [];
            predators = predators.filter(pred => {
                const eatenHerb = pred.update(herbivores);
                if (eatenHerb) {
                    pred.energy += CONFIG.energyGain.eating;
                    pred.huntCooldown = 30;
                    deadHerbivores.add(eatenHerb.id);
                }
                if (pred.canReproduce() && predators.length + newPredators.length < CONFIG.maxEntities.predators) {
                    pred.energy -= CONFIG.reproductionCost;
                    newPredators.push(new Predator(pred.x + (Math.random() - 0.5) * 20, pred.y + (Math.random() - 0.5) * 20));
                }
                return pred.energy > 0;
            });
            predators.push(...newPredators);
            herbivores = herbivores.filter(h => !deadHerbivores.has(h.id));

            // Log significant events
            if (generation - lastLogTime > 500) {
                if (herbivores.length === 0 && predators.length > 0) {
                    log('Herbivores extinct! Predators starving...');
                } else if (predators.length === 0 && herbivores.length > 0) {
                    log('Predators extinct! Herbivore boom incoming...');
                } else if (plants.length < 10) {
                    log('Plants critically low!');
                }
                lastLogTime = generation;
            }

            // Auto-recovery: spawn plants if ecosystem collapses
            if (plants.length < 5) {
                for (let i = 0; i < 10; i++) {
                    plants.push(new Plant(Math.random() * canvas.width, Math.random() * canvas.height));
                }
                log('Emergency plant seeding...');
            }

            updateStats();
        }

        function draw() {
            ctx.fillStyle = '#0d1117';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw subtle grid
            ctx.strokeStyle = '#1a1f26';
            ctx.lineWidth = 1;
            const gridSize = 40;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Draw entities
            for (const plant of plants) plant.draw();
            for (const herb of herbivores) herb.draw();
            for (const pred of predators) pred.draw();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // === CONTROLS ===
        document.getElementById('pause-btn').addEventListener('click', () => {
            paused = !paused;
            document.getElementById('pause-btn').textContent = paused ? 'Resume' : 'Pause';
            log(paused ? 'Simulation paused' : 'Simulation resumed');
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            initWorld();
        });

        document.getElementById('add-plants').addEventListener('click', () => {
            for (let i = 0; i < 20; i++) {
                plants.push(new Plant(Math.random() * canvas.width, Math.random() * canvas.height));
            }
            log('Added 20 plants');
        });

        document.getElementById('add-herbs').addEventListener('click', () => {
            for (let i = 0; i < 10; i++) {
                herbivores.push(new Herbivore(Math.random() * canvas.width, Math.random() * canvas.height));
            }
            log('Added 10 herbivores');
        });

        document.getElementById('add-preds').addEventListener('click', () => {
            for (let i = 0; i < 5; i++) {
                predators.push(new Predator(Math.random() * canvas.width, Math.random() * canvas.height));
            }
            log('Added 5 predators');
        });

        // Sliders
        const sliderConfigs = [
            { id: 'plant-rate', config: 'plantGrowthRate', display: 'plant-rate-val' },
            { id: 'herb-speed', config: 'herbivoreSpeed', display: 'herb-speed-val' },
            { id: 'pred-speed', config: 'predatorSpeed', display: 'pred-speed-val' },
            { id: 'repro-thresh', config: 'reproductionThreshold', display: 'repro-thresh-val' },
            { id: 'vision', config: 'visionRange', display: 'vision-val' }
        ];

        sliderConfigs.forEach(({ id, config, display }) => {
            const slider = document.getElementById(id);
            slider.addEventListener('input', () => {
                CONFIG[config] = parseFloat(slider.value);
                document.getElementById(display).textContent = slider.value;
            });
        });

        // Click to add entities
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (e.shiftKey) {
                predators.push(new Predator(x, y));
                log('Spawned predator');
            } else if (e.ctrlKey || e.metaKey) {
                herbivores.push(new Herbivore(x, y));
                log('Spawned herbivore');
            } else {
                plants.push(new Plant(x, y));
            }
        });

        // === START ===
        initWorld();
        gameLoop();
        log('Click: plant | Ctrl+Click: herbivore | Shift+Click: predator');
    </script>
</body>
</html>
