[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcstudio"
version = "0.1.0"
description = "Minecraft mod data model and multi-loader export engine"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mcstudio = "mcstudio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
